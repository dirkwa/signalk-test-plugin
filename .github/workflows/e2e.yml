# End-to-end check for SignalK/signalk-server#3100, scenario: workspaces
# npm workspaces: plugin in packages/, the only package-lock.json at the root.
#
# Runs the reusable plugin-ci twice on the same checkout: from master as of
# the fix's base commit, and from the fix branch.
name: plugin-ci e2e #3100 (workspaces)

on:
  push:
  workflow_dispatch:

jobs:
  master:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@f5e91aa74817ca14bbff6b4ae47f8c83f3fe0b36
    with:
      working-directory: packages/signalk-test-plugin
      node-versions: '["24"]'
      enable-signalk-integration: true

  fix:
    uses: dirkwa/signalk-server/.github/workflows/plugin-ci.yml@plugin-ci-cache-working-directory
    with:
      working-directory: packages/signalk-test-plugin
      node-versions: '["24"]'
      enable-signalk-integration: true
